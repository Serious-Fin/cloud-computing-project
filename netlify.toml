# Netlify configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
# No build command: this site is already plain HTML/CSS/JS.
# Publish the repository root, where index.html lives.
publish = "."

# Long-lived caching for static assets.
# Note: if you edit a file in /assets and the name stays the same, visitors
# may hold the old copy for up to one year. Rename the file or bump a query
# string when you change it.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "SAMEORIGIN"

# 404.html at the publish root is picked up automatically as the error page.
